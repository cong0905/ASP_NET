name: .NET Core CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ShopNet.sln

    - name: Build solution (Release)
      run: dotnet build ShopNet.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test ShopNet.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"
